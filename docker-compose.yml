services:
  easycolab-web:
    build:
      context: .
      dockerfile: Dockerfile
      # 内网若有现成的 python 镜像，取消注释下面这行可省掉重复拉取
      # args:
      #   BASE_IMAGE: your-registry/python:3.13
    image: easycolab-web:local
    container_name: easycolab-web
    restart: unless-stopped
    ports:
      # 注意：无内置鉴权，默认对局域网开放。只想本机用请改成 "127.0.0.1:8626:8626"
      - "8626:8626"
    volumes:
      # 上游 easycolab 仓库，只读挂载（本项目依赖它的 colab_bridge.py 与 app.py）
      - ../easycolab:/opt/easycolab:ro
      # 凭证、配置与生成产物
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
      # HOME 指向挂载卷，否则 OAuth token 落在 /root，容器重建后授权失效
      HOME: /data
      EASYCOLAB_DATA_DIR: /data
      EASYCOLAB_REPO_DIR: /opt/easycolab
      EASYCOLAB_OUTPUT_DIR: /data/outputs
      # 容器需要访问 accounts.google.com / oauth2.googleapis.com 完成授权。
      # 若宿主机在国内、无法直连 Google，取消下面注释并改成你的代理地址。
      # 注意：代理地址必须从容器内可达。容器访问宿主机请用宿主机 IP 或
      # host.docker.internal（并开启 extra_hosts），不要用 127.0.0.1。
      # HTTP_PROXY: http://192.168.1.10:7890
      # HTTPS_PROXY: http://192.168.1.10:7890
      # NO_PROXY: localhost,127.0.0.1,192.168.0.0/16
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8626/api/health',timeout=4).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: easycolab-net
    ipam:
      config:
        # docker 默认地址池容易被多容器环境耗尽，显式指定一个空闲网段
        - subnet: 172.32.250.0/24